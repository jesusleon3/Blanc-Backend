<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem("blanc-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Escalamientos · Blanc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ad2860%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22>B</text></svg>" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#ad2860" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Blanc" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/screens.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div class="desc" id="scope-desc">Conversaciones que la IA detuvo automáticamente y requieren atención humana (ADR-016)</div>
      </div>

      <div class="kanban" id="kanban"></div>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa.js"></script>
<script>
  App.init("escalamientos");

  const COLS = [
    { key: "abierto", label: "Abierto", hint: "Esperando que un empleado tome control" },
    { key: "en_atencion", label: "En atención", hint: "Un empleado ya tomó el control" },
    { key: "resuelto", label: "Resuelto", hint: "Control devuelto al bot o cerrado" },
  ];

  function ticketSucursalId(t) {
    const conv = DB.conversaciones.find(c => c.id === t.conversacionId);
    return conv ? conv.sucursalId : null;
  }

  function render() {
    document.getElementById("scope-desc").textContent = `Conversaciones que la IA detuvo automáticamente y requieren atención humana (ADR-016) — ${App.scopeLabel()}`;
    const ticketsScoped = App.filterBySucursal(DB.tickets, ticketSucursalId);
    document.getElementById("kanban").innerHTML = COLS.map(col => {
      const tickets = ticketsScoped.filter(t => t.estado === col.key);
      return `<div class="kanban-col">
        <div class="kanban-col-head">
          <div><span class="font-semibold text-sm">${col.label}</span> <span class="badge badge-neutral">${tickets.length}</span></div>
        </div>
        <div class="text-xs text-tertiary mb-3">${col.hint}</div>
        ${tickets.length ? tickets.map(t => {
          const conv = DB.conversaciones.find(c => c.id === t.conversacionId);
          const cli = DB.cliente(conv.clientaId);
          return `<div class="kanban-card" onclick="location.href='chat.html?id=${conv.id}'">
            <div class="flex items-center gap-2 mb-2">${Utils.avatarHTML(cli.nombre,"sm")}<span class="font-semibold text-sm">${cli.nombre}</span></div>
            <div class="mb-2">${Components.motivoEscalamiento(t.motivo)}</div>
            <div class="flex items-center justify-between text-xs text-tertiary">
              <span>${DB.sucursal(conv.sucursalId).nombre.replace("Blanc ","")}</span>
              <span>${Utils.relativeTime(t.creado)}</span>
            </div>
            <div class="divider" style="margin:10px 0;"></div>
            <div class="flex items-center gap-2 text-xs">${Utils.avatarHTML(t.empleadoAsignado,"xs")}${t.empleadoAsignado}</div>
          </div>`;
        }).join("") : `<div class="text-center text-xs text-tertiary" style="padding:24px 0;">Sin tickets</div>`}
      </div>`;
    }).join("");
  }

  render();
  document.addEventListener("blanc:sucursal-change", render);
</script>
</body>
</html>
