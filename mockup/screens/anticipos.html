<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem("blanc-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Anticipos · Blanc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ad2860%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22>B</text></svg>" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#ad2860" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Blanc" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/screens.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area">
    <div id="topbar-mount"></div>
    <div class="page-content" id="content"></div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa.js"></script>
<script>
  App.init("anticipos");
  let filtro = "todas";

  const ESTADOS = ["todas","pendiente","pagado","expirado","reembolsado"];

  function anticipoSucursalId(a) {
    const cita = DB.citas.find(c => c.id === a.citaId);
    return cita ? cita.sucursalId : null;
  }

  function renderShell() {
    const scoped = App.filterBySucursal(DB.anticipos, anticipoSucursalId);
    document.getElementById("content").innerHTML = `
      <div class="page-header">
        <div class="desc">Solicitudes de anticipo — únicamente para clientas en lista roja · ${App.scopeLabel()}</div>
        <div class="filters-bar" id="filters"></div>
      </div>
      <div class="grid grid-4 mb-6">
        ${Components.statTile({ label: "Pendientes", value: scoped.filter(a=>a.estado==="pendiente").length })}
        ${Components.statTile({ label: "Pagados (mes)", value: scoped.filter(a=>a.estado==="pagado").length })}
        ${Components.statTile({ label: "Expirados (mes)", value: scoped.filter(a=>a.estado==="expirado").length })}
        ${Components.statTile({ label: "Monto retenido", value: Utils.money(scoped.filter(a=>a.estado==="pendiente").reduce((s,a)=>s+a.monto,0)) })}
      </div>
      <div class="card animate-in"><div class="table-wrap"><table class="data-table">
        <thead><tr><th>Clienta</th><th>Cita</th><th>Monto</th><th>Solicitado</th><th>Estado</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table></div><div id="empty" style="display:none;"></div></div>
    `;
    document.getElementById("filters").innerHTML = ESTADOS.map(e => `<div class="filter-chip ${e===filtro?"active":""}" data-f="${e}">${e==="todas"?"Todas":e[0].toUpperCase()+e.slice(1)}</div>`).join("");
    Utils.qsa(".filter-chip").forEach(chip => chip.addEventListener("click", () => { filtro = chip.dataset.f; renderShell(); renderRows(); }));
    renderRows();
  }

  function renderRows() {
    const rows = App.filterBySucursal(DB.anticipos, anticipoSucursalId).filter(a => filtro === "todas" || a.estado === filtro);
    document.getElementById("empty").style.display = rows.length ? "none" : "block";
    if (!rows.length) document.getElementById("empty").innerHTML = Components.emptyState({ icon: "wallet", title: "Sin anticipos en este estado", desc: "Los anticipos se solicitan automáticamente al confirmar una cita de una clienta en lista roja." });
    document.getElementById("tbody").innerHTML = rows.map(a => {
      const cita = DB.citas.find(c => c.id === a.citaId);
      return `<tr onclick="location.href='cita-detalle.html?id=${a.citaId}'">
        <td>${Components.clientaCell(a.clientaId)}</td>
        <td class="text-secondary mono">${cita ? cita.id.replace("cit-","#") : "—"}</td>
        <td class="cell-primary">${Utils.money(a.monto)}</td>
        <td class="text-secondary">${Utils.relativeTime(a.creado)}</td>
        <td>${Components.badgeAnticipoEstado(a.estado)}</td>
        <td onclick="event.stopPropagation()">
          ${a.estado === "pendiente" ? `<button class="btn btn-secondary btn-sm" onclick="accion('Recordatorio de pago reenviado')">Reenviar</button>` : ""}
        </td>
      </tr>`;
    }).join("");
  }

  function accion(msg) { App.toast("success", msg, "Enviado por WhatsApp."); }

  renderShell();
  document.addEventListener("blanc:sucursal-change", renderShell);
</script>
</body>
</html>
