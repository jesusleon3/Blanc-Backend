<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem("blanc-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Notificaciones · Blanc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ad2860%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22>B</text></svg>" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#ad2860" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Blanc" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/screens.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area">
    <div id="topbar-mount"></div>
    <div class="page-content" id="content"></div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa.js"></script>
<script>
  App.init("notificaciones");
  let filtro = "todas";
  const TIPOS = [["todas","Todas"],["recordatorio","Recordatorios"],["confirmación","Confirmaciones"]];

  function notifSucursalId(n) {
    const cita = DB.citas.find(c => c.id === n.citaId);
    return cita ? cita.sucursalId : null;
  }

  function renderShell() {
    const scoped = App.filterBySucursal(DB.notificaciones, notifSucursalId);
    document.getElementById("content").innerHTML = `
      <div class="page-header">
        <div class="desc">Notificaciones salientes por WhatsApp — recordatorios y confirmaciones automáticas · ${App.scopeLabel()}</div>
        <div class="filters-bar" id="filters"></div>
      </div>
      <div class="grid grid-4 mb-6">
        ${Components.statTile({ label: "Enviadas", value: scoped.filter(n=>n.estado==="enviada").length })}
        ${Components.statTile({ label: "Programadas", value: scoped.filter(n=>n.estado==="programada").length })}
        ${Components.statTile({ label: "Fallidas", value: scoped.filter(n=>n.estado==="fallida").length, delta: "Requiere revisión", deltaUp: false })}
        ${Components.statTile({ label: "Tasa de entrega", value: "97.2%" })}
      </div>
      <div class="card animate-in"><div class="table-wrap"><table class="data-table">
        <thead><tr><th>Clienta</th><th>Tipo</th><th>Canal</th><th>Cita</th><th>Fecha</th><th>Estado</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table></div><div id="empty" style="display:none;"></div></div>
    `;
    document.getElementById("filters").innerHTML = TIPOS.map(([k,l]) => `<div class="filter-chip ${k===filtro?"active":""}" data-f="${k}">${l}</div>`).join("");
    Utils.qsa(".filter-chip").forEach(chip => chip.addEventListener("click", () => { filtro = chip.dataset.f; renderShell(); }));
    renderRows();
  }

  function renderRows() {
    const rows = App.filterBySucursal(DB.notificaciones, notifSucursalId).filter(n => filtro === "todas" || n.tipo === filtro).sort((a,b)=>b.ts-a.ts);
    document.getElementById("empty").style.display = rows.length ? "none" : "block";
    if (!rows.length) document.getElementById("empty").innerHTML = Components.emptyState({ icon: "bell", title: "Sin notificaciones", desc: "Aquí aparecerán los recordatorios y confirmaciones enviados automáticamente." });
    document.getElementById("tbody").innerHTML = rows.map(n => `
      <tr onclick="location.href='cita-detalle.html?id=${n.citaId}'">
        <td>${Components.clientaCell(n.clientaId)}</td>
        <td style="text-transform:capitalize;">${n.tipo}</td>
        <td class="text-secondary">${n.canal}</td>
        <td class="text-secondary mono">${n.citaId.replace("cit-","#")}</td>
        <td class="text-secondary">${Utils.dateTimeLabel(n.ts)}</td>
        <td>${Components.badgeNotifEstado(n.estado)}</td>
      </tr>`).join("");
  }

  renderShell();
  document.addEventListener("blanc:sucursal-change", renderShell);
</script>
</body>
</html>
