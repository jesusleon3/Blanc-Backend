<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem("blanc-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Conversación · Blanc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ad2860%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22>B</text></svg>" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#ad2860" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Blanc" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/screens.css" />
<style>
  .chat-layout {
    display: grid; grid-template-columns: 1fr 320px; gap: var(--space-6);
    height: calc(100vh - var(--topbar-h) - var(--space-8)*2);
    /* 100dvh evita que la barra de herramientas dinámica de iOS Safari
       recorte el chat; los navegadores sin soporte ignoran esta línea y
       se quedan con el cálculo en 100vh de arriba. */
    height: calc(100dvh - var(--topbar-h) - var(--space-8)*2);
  }
  .chat-panel { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg-elevated); overflow: hidden; }
  .chat-header { padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
  .chat-header-info { flex: 1; min-width: 0; }
  .chat-header-info .font-semibold { overflow-wrap: break-word; }
  .chat-header-info .text-tertiary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-header-actions { display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0; }
  .chat-input-bar { padding: var(--space-4); border-top: 1px solid var(--border); display: flex; gap: var(--space-3); align-items: center; }
  @media (max-width: 1000px) { .chat-layout { grid-template-columns: 1fr; height: auto; } }
  @media (max-width: 480px) {
    /* La info del cliente no pierde nada (el nombre puede pasar a una
       segunda línea); el badge + botón de handoff bajan a su propia fila
       para no aplastar el nombre en columnas de una palabra. */
    .chat-header-actions { flex: 1 1 100%; justify-content: space-between; order: 3; }
  }
</style>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area">
    <div id="topbar-mount"></div>
    <div class="page-content" id="content"></div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa.js"></script>
<script>
  App.init("conversaciones", "chat");
  const id = Utils.param("id");
  const conv = DB.conversaciones.find(c => c.id === id) || DB.conversaciones[0];
  const cli = DB.cliente(conv.clientaId);
  const ticket = DB.tickets.find(t => t.conversacionId === conv.id);
  let modoActual = conv.modo;

  function bubbleHTML(m) {
    if (m.tipo === "sistema") return `<div class="bubble-row"><div class="bubble system">${m.texto}</div></div>`;
    const out = m.de !== "clienta";
    let body = "";
    if (m.tipo === "imagen") body = `<div style="width:180px;height:130px;border-radius:8px;background:linear-gradient(135deg,var(--accent-200),var(--accent-400));display:flex;align-items:center;justify-content:center;color:#fff;">${ICONS.image}</div><div class="mt-2">${m.texto}</div>`;
    else if (m.tipo === "audio") body = `<div class="flex items-center gap-2">${ICONS.mic}<div class="progress" style="width:110px;"><div class="progress-bar" style="width:40%;"></div></div><span class="text-xs">0:38</span></div>`;
    else body = m.texto;
    return `<div class="bubble-row ${out?"out":""}">
      <div class="bubble ${out?"out":"in"}">
        ${body}
        <div class="bubble-meta">
          ${m.de === "bot" ? `<span class="bubble-ia-tag">${ICONS.sparkle} ${m.ia && m.ia.intencion === "clarificar_ambiguedad" ? "Detectó respuesta ambigua" : "IA"}</span>` : m.de === "humano" ? `<span>${m.autor||"Empleado"}</span>` : ""}
          <span>${Utils.timeLabel(m.ts)}</span>
        </div>
        ${m.ia ? `<div class="text-xs text-tertiary mt-1" style="border-top:1px dashed var(--border);padding-top:4px;">Intención: ${m.ia.intencion} · Sentimiento: ${m.ia.sentimiento} · ${m.ia.tokens} tok · $${m.ia.costo.toFixed(3)}</div>` : ""}
      </div>
    </div>`;
  }

  function render() {
    document.getElementById("content").innerHTML = `
      <a href="conversaciones.html" class="text-sm text-secondary flex items-center gap-1 mb-4">${ICONS.chevronLeft} Volver a conversaciones</a>
      <div class="chat-layout">
        <div class="chat-panel">
          <div class="chat-header">
            ${Utils.avatarHTML(cli.nombre, "md")}
            <div class="chat-header-info">
              <div class="font-semibold text-sm">${cli.nombre}</div>
              <div class="text-xs text-tertiary">${cli.telefono} · ${DB.sucursal(conv.sucursalId).nombre}</div>
            </div>
            <div class="chat-header-actions">
              <span id="modo-badge"></span>
              <button class="btn ${modoActual==='humano'?'btn-secondary':'btn-primary'} btn-sm" id="btn-handoff" onclick="toggleHandoff()"></button>
            </div>
          </div>

          ${ticket ? `<div class="surface-muted" style="margin:var(--space-4) var(--space-4) 0;border-color:var(--warning-500);background:var(--warning-100);">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2 text-sm font-semibold" style="color:var(--warning-500);">${ICONS.alert} Ticket ${ticket.id} · ${Components.motivoEscalamiento(ticket.motivo)}</div>
              ${Components.badgeTicketEstado(ticket.estado)}
            </div>
            <div class="text-xs text-secondary mt-1">Asignado a ${ticket.empleadoAsignado} · creado ${Utils.relativeTime(ticket.creado)}</div>
          </div>` : ""}

          <div class="chat-scroll" id="chat-scroll">
            ${conv.mensajes.map(bubbleHTML).join("")}
            ${modoActual === "bot" ? `<div class="bubble-row"><div class="bubble in"><span class="typing-dots"><span></span><span></span><span></span></span></div></div>` : ""}
          </div>

          <div class="chat-input-bar">
            <input class="input" id="input-msg" placeholder="${modoActual==='humano' ? `Responder como ${App.getCurrentUser().nombre}…` : 'El bot está respondiendo automáticamente…'}" ${modoActual==='bot'?'disabled':''} onkeydown="if(event.key==='Enter')enviarMensaje()" />
            <button class="btn btn-primary btn-icon" onclick="enviarMensaje()" ${modoActual==='bot'?'disabled':''}>${ICONS.chevronRight}</button>
          </div>
        </div>

        <div class="flex flex-col gap-4">
          <div class="card">
            <div class="card-header"><h3>Clienta</h3></div>
            <div class="card-body">
              <div class="mb-3">${Components.badgeClientaEstado(cli.estado)}</div>
              <div class="text-xs text-tertiary mb-1">Última visita</div>
              <div class="text-sm font-medium mb-3">${Utils.dateLabel(cli.stats.ultimaVisita)}</div>
              <div class="text-xs text-tertiary mb-1">Ticket promedio</div>
              <div class="text-sm font-medium mb-3">${Utils.money(cli.stats.ticketPromedio)}</div>
              <div class="text-xs text-tertiary mb-1">Servicios favoritos</div>
              <div class="text-sm font-medium mb-4">${cli.stats.serviciosFavoritos.join(", ")}</div>
              <a href="clienta-perfil.html?id=${cli.id}" class="btn btn-secondary btn-sm btn-block">Ver perfil completo</a>
            </div>
          </div>
          <div class="card">
            <div class="card-header"><h3>Memoria de conversación</h3></div>
            <div class="card-body">
              <p class="text-sm text-secondary" style="line-height:var(--lh-relaxed);">Contexto persistente entre conversaciones: prefiere tonos ${cli.stats.serviciosFavoritos.includes("Nail Art")?"llamativos con diseño":"clásicos"}, suele agendar en ${DB.sucursal(cli.sucursalFavorita).nombre.replace("Blanc ","")}.</p>
            </div>
          </div>
        </div>
      </div>
    `;
    document.getElementById("modo-badge").innerHTML = modoActual === "humano" ? `<span class="badge badge-warning">${ICONS.user}Modo humano</span>` : `<span class="badge badge-accent">${ICONS.sparkle}Modo bot</span>`;
    document.getElementById("btn-handoff").textContent = modoActual === "humano" ? "Devolver al bot" : "Tomar control";
    const scroll = document.getElementById("chat-scroll");
    if (scroll) scroll.scrollTop = scroll.scrollHeight;
  }

  function toggleHandoff() {
    modoActual = modoActual === "humano" ? "bot" : "humano";
    render();
    App.toast("success", modoActual === "humano" ? `Control tomado por ${App.getCurrentUser().nombre}` : "Control devuelto al bot",
      modoActual === "humano" ? "La IA se detiene inmediatamente para esta conversación (ADR-016)." : "El bot revalida el modo antes de responder de nuevo.");
  }

  function enviarMensaje() {
    const input = document.getElementById("input-msg");
    if (!input.value.trim()) return;
    conv.mensajes.push({ de: "humano", tipo: "texto", texto: input.value.trim(), ts: new Date(), autor: App.getCurrentUser().nombre });
    input.value = "";
    render();
  }

  render();
</script>
</body>
</html>
