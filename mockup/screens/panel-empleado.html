<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem("blanc-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Panel del empleado · Blanc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ad2860%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22>B</text></svg>" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#ad2860" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Blanc" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/screens.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area">
    <div id="topbar-mount"></div>
    <div class="page-content">

      <div class="card mb-6 animate-in" style="background:linear-gradient(120deg, var(--accent-subtle), var(--bg-elevated));">
        <div class="card-body flex items-center justify-between wrap gap-4">
          <div>
            <h2 style="font-size:var(--fs-xl);" id="saludo">Hola 👋</h2>
            <p class="text-secondary text-sm mt-1" id="fecha-hoy"></p>
          </div>
          <div class="flex gap-6">
            <div class="text-center"><div class="stat-value" style="font-size:var(--fs-xl);" id="count-citas-hoy"></div><div class="text-xs text-tertiary">Citas hoy</div></div>
            <div class="text-center"><div class="stat-value" style="font-size:var(--fs-xl);color:var(--danger-500);" id="count-tickets"></div><div class="text-xs text-tertiary">Tickets pendientes</div></div>
          </div>
        </div>
      </div>

      <div class="grid row-14-10">
        <div class="flex flex-col gap-6">
          <div class="card animate-in">
            <div class="card-header">
              <h3 id="citas-heading">Próximas citas</h3>
              <a href="agenda.html" class="btn btn-ghost btn-sm">Ver agenda</a>
            </div>
            <div id="citas-list"></div>
          </div>
        </div>

        <div class="flex flex-col gap-6">
          <div class="card animate-in">
            <div class="card-header"><h3>Requieren atención</h3></div>
            <div id="tickets-list"></div>
          </div>
          <div class="card animate-in">
            <div class="card-header"><h3>Chats sin contestar</h3></div>
            <div id="sin-contestar-list"></div>
          </div>
          <div class="card animate-in">
            <div class="card-header"><h3>Accesos rápidos</h3></div>
            <div class="card-body flex flex-col gap-2">
              <a href="cita-nueva.html" class="btn btn-secondary btn-block"><span id="icon-plus"></span> Nueva cita</a>
              <a href="crm.html" class="btn btn-secondary btn-block"><span id="icon-users"></span> Buscar clienta</a>
              <a href="lista-espera.html" class="btn btn-secondary btn-block"><span id="icon-clock"></span> Lista de espera</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa.js"></script>
<script>
  App.init("panel-empleado");
  document.getElementById("icon-plus").innerHTML = ICONS.plus;
  document.getElementById("icon-users").innerHTML = ICONS.users;
  document.getElementById("icon-clock").innerHTML = ICONS.clock;

  // El panel del empleado se ancla a SU sucursal real (según el rol elegido
  // en el login), no a una fija hardcodeada. Solo los roles con alcance
  // "todas" (Super Admin, Administrador, Analista, Solo lectura) siguen el
  // selector global de sucursal del sidebar.
  function sucursalDelEmpleado() {
    const user = App.getCurrentUser();
    if (user.sucursales !== "todas") {
      const suc = DB.sucursales.find(s => s.nombre === user.sucursales);
      if (suc) return suc.id;
    }
    return App.isTodasSucursales() ? DB.sucursales[0].id : App.getSucursal();
  }

  function render() {
    const user = App.getCurrentUser();
    const sucId = sucursalDelEmpleado();
    const suc = DB.sucursal(sucId);
    const primerNombre = user.nombre.split(" ")[0];

    document.getElementById("saludo").textContent = `Hola, ${primerNombre} 👋`;
    document.getElementById("citas-heading").textContent = `Próximas citas — ${suc.nombre}`;
    document.getElementById("fecha-hoy").textContent = suc.nombre + " · " + new Date().toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"});

    const citasHoySuc = DB.citas.filter(c => c.sucursalId === sucId && new Date(c.inicio).toDateString() === new Date().toDateString());
    const ticketsSuc = DB.tickets.filter(t => {
      if (t.estado === "resuelto") return false;
      const conv = DB.conversaciones.find(c => c.id === t.conversacionId);
      return conv && conv.sucursalId === sucId;
    });

    document.getElementById("count-citas-hoy").textContent = citasHoySuc.length;
    document.getElementById("count-tickets").textContent = ticketsSuc.length;

    const citasHoy = citasHoySuc.slice().sort((a,b)=>a.inicio-b.inicio);
    document.getElementById("citas-list").innerHTML = citasHoy.length ? citasHoy.map(c => {
      const cli = DB.cliente(c.clientaId);
      const mani = DB.manicurista(c.manicuristaId);
      return `<div class="card-body flex items-center gap-4" style="border-bottom:1px solid var(--border);cursor:pointer;" onclick="location.href='cita-detalle.html?id=${c.id}'">
        <div class="text-center" style="width:56px;flex-shrink:0;"><div class="font-semibold text-sm">${Utils.timeLabel(c.inicio)}</div></div>
        ${Utils.avatarHTML(cli.nombre,"sm")}
        <div style="flex:1;min-width:0;">
          <div class="font-semibold text-sm truncate">${cli.nombre}</div>
          <div class="text-xs text-tertiary truncate">${c.composicion.servicios.join(" + ")} · ${mani ? mani.nombre : "Sin preferencia"}</div>
        </div>
        ${Components.badgeCitaEstado(c.estado)}
      </div>`;
    }).join("") : `<div class="card-body">${Components.emptyState({icon:"calendar",title:"Sin más citas hoy",desc:"Buen momento para revisar la lista de espera o el catálogo de servicios."})}</div>`;

    // Chats sin contestar (Sesión 02, requisito F1/O3): último mensaje es de la
    // clienta y la conversación sigue activa, sin importar si está en modo bot o
    // humano — es exactamente el escenario que la dueña describió como "se pierden".
    const convsSuc = DB.conversaciones.filter(c => c.sucursalId === sucId && c.estado === "activa" && c.mensajes[c.mensajes.length-1].de === "clienta");
    document.getElementById("sin-contestar-list").innerHTML = convsSuc.length ? convsSuc.map(c => {
      const cliConv = DB.cliente(c.clientaId);
      const msg = c.mensajes[c.mensajes.length-1];
      return `<div class="card-body flex items-center gap-3" style="border-bottom:1px solid var(--border);cursor:pointer;" onclick="location.href='chat.html?id=${c.id}'">
        ${Utils.avatarHTML(cliConv.nombre,"sm")}
        <div style="flex:1;min-width:0;">
          <div class="font-semibold text-sm truncate">${cliConv.nombre}</div>
          <div class="text-xs text-tertiary truncate">${msg.texto}</div>
        </div>
        <span class="text-xs text-tertiary">${Utils.relativeTime(msg.ts)}</span>
      </div>`;
    }).join("") : `<div class="card-body"><p class="text-sm text-tertiary">Sin chats pendientes de respuesta 🎉</p></div>`;

    document.getElementById("tickets-list").innerHTML = ticketsSuc.length ? ticketsSuc.map(t => {
      const conv = DB.conversaciones.find(c => c.id === t.conversacionId);
      const cli = DB.cliente(conv.clientaId);
      return `<div class="card-body flex items-center gap-3" style="border-bottom:1px solid var(--border);cursor:pointer;" onclick="location.href='chat.html?id=${conv.id}'">
        ${Utils.avatarHTML(cli.nombre,"sm")}
        <div style="flex:1;min-width:0;">
          <div class="font-semibold text-sm truncate">${cli.nombre}</div>
          <div class="text-xs text-tertiary">${Utils.relativeTime(t.creado)}</div>
        </div>
        ${Components.badgeTicketEstado(t.estado)}
      </div>`;
    }).join("") : `<div class="card-body"><p class="text-sm text-tertiary">Sin tickets pendientes 🎉</p></div>`;
  }

  render();
  document.addEventListener("blanc:sucursal-change", () => {
    // Solo re-renderiza por el switch global si el rol actual no tiene
    // una sucursal fija propia (ver sucursalDelEmpleado).
    if (App.getCurrentUser().sucursales === "todas") render();
  });
</script>
</body>
</html>
