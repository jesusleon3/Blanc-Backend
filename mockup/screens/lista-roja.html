<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem("blanc-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Lista roja · Blanc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ad2860%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22>B</text></svg>" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#ad2860" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Blanc" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/screens.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area">
    <div id="topbar-mount"></div>
    <div class="page-content" id="content"></div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa.js"></script>
<script>
  App.init("lista-roja");

  function render() {
    const clientasSuc = App.filterBySucursal(DB.clientas, c => c.sucursalFavorita);
    const enListaRoja = clientasSuc.filter(c => c.estado === "lista_roja");
    const sugeridas = clientasSuc.filter(c => c.estado !== "lista_roja" &&
      DB.citas.some(cit => cit.clientaId === c.id && (cit.estado === "cancelada" || cit.estado === "no_show")));

    document.getElementById("content").innerHTML = `
      <div class="page-header">
        <div class="desc">Clientas con anticipo obligatorio y cancelación restringida — la asignación siempre requiere confirmación de un empleado (Pregunta Abierta #3) · ${App.scopeLabel()}</div>
      </div>

      <div class="grid grid-3 mb-6">
        ${Components.statTile({ label: "En lista roja", value: enListaRoja.length })}
        ${Components.statTile({ label: "Candidatas sugeridas", value: sugeridas.length, sub: "Con cancelaciones o no-show recientes" })}
        ${Components.statTile({ label: "Anticipo promedio solicitado", value: Utils.money(180) })}
      </div>

      <div class="card animate-in mb-6">
        <div class="card-header"><h3>Clientas en lista roja</h3></div>
        ${enListaRoja.length ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Clienta</th><th>Motivo</th><th>Última visita</th><th>Visitas</th><th></th></tr></thead><tbody>
          ${enListaRoja.map(c => `<tr>
            <td>${Components.clientaCell(c.id)}</td>
            <td class="text-secondary" style="max-width:340px;">${c.notas || "Historial de cancelaciones frecuentes."}</td>
            <td class="text-secondary">${Utils.dateLabel(c.stats.ultimaVisita)}</td>
            <td>${c.stats.visitas}</td>
            <td><button class="btn btn-secondary btn-sm" onclick="quitar('${c.id}')">Quitar de lista roja</button></td>
          </tr>`).join("")}
        </tbody></table></div>` : `<div class="card-body">${Components.emptyState({icon:"shield", title:"Sin clientas en lista roja", desc:"Cuando un empleado marque a una clienta por historial de cancelaciones, aparecerá aquí."})}</div>`}
      </div>

      <div class="card animate-in">
        <div class="card-header">
          <h3>Candidatas sugeridas por el sistema</h3>
          <span class="badge badge-neutral">Solo el negocio decide — la IA nunca asigna automáticamente</span>
        </div>
        ${sugeridas.length ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Clienta</th><th>Motivo sugerido</th><th></th></tr></thead><tbody>
          ${sugeridas.map(c => {
            const citaProblema = DB.citas.find(cit => cit.clientaId === c.id && (cit.estado === "cancelada" || cit.estado === "no_show"));
            return `<tr>
              <td>${Components.clientaCell(c.id)}</td>
              <td class="text-secondary">${citaProblema.estado === "no_show" ? "No se presentó a una cita reciente" : "Canceló una cita con poca anticipación"} (${Utils.dateLabel(citaProblema.inicio)})</td>
              <td><button class="btn btn-primary btn-sm" onclick="marcar('${c.id}')">Marcar lista roja</button></td>
            </tr>`;
          }).join("")}
        </tbody></table></div>` : `<div class="card-body"><p class="text-sm text-tertiary">Sin candidatas sugeridas por ahora.</p></div>`}
      </div>
    `;
  }

  function quitar(id) { App.toast("success", `${DB.cliente(id).nombre} removida de lista roja`, "Ya no requerirá anticipo para sus próximas citas."); }
  function marcar(id) { App.toast("success", `${DB.cliente(id).nombre} marcada como lista roja`, "Sus próximas citas requerirán anticipo antes de confirmarse en firme."); }

  render();
  document.addEventListener("blanc:sucursal-change", render);
</script>
</body>
</html>
