<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem("blanc-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Analytics · Blanc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ad2860%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22>B</text></svg>" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#ad2860" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Blanc" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/screens.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area">
    <div id="topbar-mount" data-actions='<button class="btn btn-secondary btn-sm" onclick="App.toast(&apos;info&apos;,&apos;Exportando reporte&apos;,&apos;Acción simulada — sin efecto real sobre datos persistentes.&apos;)">Exportar reporte</button>'></div>
    <div class="page-content" id="content"></div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa.js"></script>
<script>
  App.init("analytics");

  function render() {
    const cur = App.getSucursal();
    const todas = App.isTodasSucursales();
    const K = DB.metrics(cur);
    const citasSuc = todas ? DB.citas : DB.citas.filter(c => c.sucursalId === cur);

    document.getElementById("content").innerHTML = `
      <div class="page-header">
        <div class="desc">Métricas de negocio, operación e inteligencia artificial — ${App.scopeLabel()}, últimos 30 días</div>
        <div class="segmented"><button class="active" onclick="App.selectSegment(this)">30 días</button><button onclick="App.selectSegment(this)">90 días</button><button onclick="App.selectSegment(this)">Año</button></div>
      </div>

      <div class="grid grid-4 mb-6">
        ${Components.statTile({ label: "Satisfacción", value: `${K.satisfaccion} / 5` })}
        ${Components.statTile({ label: "Tiempo de respuesta", value: K.tiempoRespuestaPromedio })}
        ${Components.statTile({ label: "Costo de IA", value: Utils.money(K.costoIAMes), sub: `${(K.tokensConsumidosMes/1000).toFixed(1).replace(/\.0$/, "")}k tokens` })}
        ${Components.statTile({ label: "Ocupación de agenda", value: `${K.horasOcupadas.total ? Math.round(K.horasOcupadas.ocupadas/K.horasOcupadas.total*100) : 0}%`, sub: `${K.horasOcupadas.ocupadas} de ${K.horasOcupadas.total} horas` })}
      </div>

      <div class="grid ${todas ? "row-1-1" : ""}" id="row-1">
        ${todas ? `<div class="card animate-in">
          <div class="card-header"><h3>Ventas por sucursal</h3></div>
          <div class="card-body" id="sucursal-bars"></div>
        </div>` : ""}
        <div class="card animate-in">
          <div class="card-header"><h3>Embudo de conversión</h3></div>
          <div class="card-body" id="embudo"></div>
        </div>
      </div>

      <div class="grid mt-6 row-1-1">
        <div class="card animate-in">
          <div class="card-header"><h3>Servicios más vendidos</h3></div>
          <div class="card-body" id="servicios"></div>
        </div>
        <div class="card animate-in">
          <div class="card-header"><h3>Cancelaciones vs. completadas</h3></div>
          <div class="card-body" id="cancel-donut-wrap"></div>
        </div>
      </div>

      <div class="card mt-6 animate-in">
        <div class="card-header"><h3>Costo e interacción de IA</h3></div>
        <div class="card-body grid grid-4">
          <div><div class="text-xs text-tertiary mb-1">Conversaciones (mes)</div><div class="font-semibold text-lg">${K.conversacionesMes}</div></div>
          <div><div class="text-xs text-tertiary mb-1">Resueltas 100% por IA</div><div class="font-semibold text-lg">${K.iaVsHumano.ia}%</div></div>
          <div><div class="text-xs text-tertiary mb-1">Tokens consumidos</div><div class="font-semibold text-lg">${(K.tokensConsumidosMes/1000).toFixed(1).replace(/\.0$/, "")}k</div></div>
          <div><div class="text-xs text-tertiary mb-1">Costo por conversación</div><div class="font-semibold text-lg">${Utils.money(K.costoIAMes/(K.conversacionesMes||1))}</div></div>
        </div>
      </div>
    `;

    if (todas) {
      const maxSuc = Math.max(...K.sucursales.map(s=>s.ventas));
      document.getElementById("sucursal-bars").innerHTML = K.sucursales.map(s => `
        <div class="mb-4">
          <div class="flex justify-between mb-1"><span class="text-sm font-medium">${s.nombre}</span><span class="text-sm text-secondary">${Utils.money(s.ventas)}</span></div>
          <div class="progress"><div class="progress-bar" style="width:${(s.ventas/maxSuc)*100}%;"></div></div>
        </div>`).join("");
    }

    const maxEmbudo = K.embudo[0].valor || 1;
    document.getElementById("embudo").innerHTML = K.embudo.map((e,i) => `
      <div class="flex items-center gap-4 mb-3">
        <div style="width:170px;" class="text-sm text-secondary">${e.etapa}</div>
        <div class="progress grow"><div class="progress-bar" style="width:${(e.valor/maxEmbudo)*100}%;background:hsl(${340-i*18} 60% 55%);"></div></div>
        <div class="text-sm font-semibold" style="width:40px;text-align:right;">${e.valor}</div>
      </div>`).join("");

    document.getElementById("servicios").innerHTML = K.serviciosMasVendidos.length ? (() => {
      const maxServ = Math.max(...K.serviciosMasVendidos.map(s=>s.valor));
      return K.serviciosMasVendidos.map(s => `
        <div class="mb-3">
          <div class="flex justify-between mb-1"><span class="text-sm font-medium">${s.nombre}</span><span class="text-sm text-secondary">${s.valor}</span></div>
          <div class="progress"><div class="progress-bar" style="width:${(s.valor/maxServ)*100}%;"></div></div>
        </div>`).join("");
    })() : `<p class="text-sm text-tertiary">Sin citas registradas todavía en esta sucursal.</p>`;

    const completadas = citasSuc.filter(c=>c.estado==="completada").length;
    const canceladas = citasSuc.filter(c=>c.estado==="cancelada"||c.estado==="no_show").length;
    const total = completadas + canceladas;
    const pctCancel = total ? Math.round((canceladas/total)*100) : 0;
    document.getElementById("cancel-donut-wrap").innerHTML = `
      <div class="flex items-center gap-6">
        <svg viewBox="0 0 36 36" class="donut">
          <circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--success-100)" stroke-width="4"/>
          <circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--danger-500)" stroke-width="4" stroke-dasharray="${pctCancel} ${100-pctCancel}" stroke-dashoffset="25" stroke-linecap="round"/>
        </svg>
        <div class="flex flex-col gap-2">
          <div class="legend-row"><span class="legend-dot" style="background:var(--success-100);border:1px solid var(--success-500);"></span> Completadas <span class="font-semibold" style="margin-left:auto;">${completadas}</span></div>
          <div class="legend-row"><span class="legend-dot" style="background:var(--danger-500);"></span> Canceladas / no-show <span class="font-semibold" style="margin-left:auto;">${canceladas}</span></div>
        </div>
      </div>`;
  }

  render();
  document.addEventListener("blanc:sucursal-change", render);
</script>
</body>
</html>
