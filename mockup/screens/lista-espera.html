<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem("blanc-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Lista de espera · Blanc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ad2860%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22>B</text></svg>" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#ad2860" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Blanc" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/screens.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div class="desc" id="scope-desc">Clientas en espera de un cupo, ordenadas por orden de llegada (FIFO)</div>
        <div class="filters-bar">
          <div class="filter-chip active" data-f="todas">Todas</div>
          <div class="filter-chip" data-f="en_espera">En espera</div>
          <div class="filter-chip" data-f="notificada">Notificadas</div>
          <div class="filter-chip" data-f="expirada">Expiradas</div>
        </div>
      </div>

      <div class="card animate-in">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>#</th><th>Clienta</th><th>Sucursal</th><th>Servicio deseado</th><th>Ventana preferida</th><th>Expira</th><th>Estado</th><th></th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div id="empty" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa.js"></script>
<script>
  App.init("lista-espera");
  let filtro = "todas";

  function render() {
    document.getElementById("scope-desc").textContent = `Clientas en espera de un cupo, ordenadas por orden de llegada (FIFO) — ${App.scopeLabel()}`;
    const rows = App.filterBySucursal(DB.listaEspera, e => e.sucursalId).filter(e => filtro === "todas" || e.estado === filtro);
    document.getElementById("empty").style.display = rows.length ? "none" : "block";
    if (!rows.length) {
      document.getElementById("empty").innerHTML = Components.emptyState({ icon: "clock", title: "Sin clientas en esta categoría", desc: "Cuando no haya horario disponible, el bot ofrecerá agregar a la clienta a la lista de espera automáticamente." });
    }
    document.getElementById("tbody").innerHTML = rows.map((e, i) => {
      const cli = DB.cliente(e.clientaId);
      return `<tr>
        <td class="text-tertiary mono">${i+1}</td>
        <td>${Components.clientaCell(e.clientaId)}</td>
        <td>${DB.sucursal(e.sucursalId).nombre.replace("Blanc ","")}</td>
        <td>${e.servicioDeseado}</td>
        <td class="text-secondary">${e.ventana}</td>
        <td class="text-secondary">${Utils.dateTimeLabel(e.expira)}</td>
        <td>${Components.badgeEsperaEstado(e.estado)}</td>
        <td>
          <div class="dropdown" id="dd-${e.id}">
            <button class="icon-btn" onclick="App.toggleDropdown('dd-${e.id}', event)">${ICONS.moreH}</button>
            <div class="dropdown-menu">
              <div class="dropdown-item" onclick="accion('${cli.nombre}', 'notificada')">${ICONS.bell} Notificar cupo disponible</div>
              <div class="dropdown-item" onclick="accion('${cli.nombre}', 'convertida')">${ICONS.calendar} Convertir en cita</div>
              <div class="dropdown-item danger" onclick="accion('${cli.nombre}', 'expirada')">${ICONS.x} Quitar de la lista</div>
            </div>
          </div>
        </td>
      </tr>`;
    }).join("");
  }

  Utils.qsa(".filter-chip").forEach(chip => chip.addEventListener("click", () => {
    Utils.qsa(".filter-chip").forEach(c => c.classList.remove("active"));
    chip.classList.add("active"); filtro = chip.dataset.f; render();
  }));

  function accion(nombre, tipo) {
    const msgs = { notificada: [`Cupo notificado a ${nombre}`, "Se envió un mensaje de WhatsApp informando la disponibilidad."], convertida: [`Cita creada para ${nombre}`, "Se generó una nueva cita a partir de la lista de espera."], expirada: [`${nombre} removida de la lista`, ""] };
    App.toast("success", ...msgs[tipo]);
  }

  render();
  document.addEventListener("blanc:sucursal-change", render);
</script>
</body>
</html>
