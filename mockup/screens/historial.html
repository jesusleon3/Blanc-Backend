<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem("blanc-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Historial · Blanc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ad2860%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22>B</text></svg>" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#ad2860" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Blanc" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/screens.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area">
    <div id="topbar-mount"></div>
    <div class="page-content" id="content"></div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa.js"></script>
<script>
  App.init("historial");
  let filtro = "todas";
  const TIPOS = [["todas","Todo"],["decision_ia","Decisiones de IA"],["config","Configuración"],["lista_roja","Lista roja"],["anticipo","Anticipos"],["prompt","Prompts"],["escalamiento","Escalamientos"]];
  const ICON_MAP = { decision_ia: ["sparkle","accent"], config: ["settings",""], lista_roja: ["shield","danger"], anticipo: ["wallet","success"], prompt: ["edit",""], escalamiento: ["alert","danger"] };

  function scopedAuditoria() {
    if (App.isTodasSucursales()) return DB.auditoria;
    const cur = App.getSucursal();
    return DB.auditoria.filter(a => a.sucursalId === cur || a.sucursalId === null);
  }

  function renderShell() {
    document.getElementById("content").innerHTML = `
      <div class="page-header">
        <div class="desc">Bitácora de auditoría — decisiones de IA y acciones administrativas (registro de solo lectura) · ${App.scopeLabel()}</div>
      </div>
      <div class="filters-bar mb-6" id="filters"></div>
      <div class="card animate-in card-body">
        <div class="timeline" id="timeline"></div>
        <div id="empty" style="display:none;"></div>
      </div>
    `;
    document.getElementById("filters").innerHTML = TIPOS.map(([k,l]) => `<div class="filter-chip ${k===filtro?"active":""}" data-f="${k}">${l}</div>`).join("");
    Utils.qsa(".filter-chip").forEach(chip => chip.addEventListener("click", () => { filtro = chip.dataset.f; renderShell(); }));
    renderRows();
  }

  function renderRows() {
    const rows = scopedAuditoria().filter(a => filtro === "todas" || a.tipo === filtro).sort((a,b)=>b.ts-a.ts);
    document.getElementById("empty").style.display = rows.length ? "none" : "block";
    document.getElementById("timeline").style.display = rows.length ? "block" : "none";
    if (!rows.length) document.getElementById("empty").innerHTML = Components.emptyState({ icon: "history", title: "Sin registros", desc: "No hay actividad de este tipo todavía." });
    document.getElementById("timeline").innerHTML = rows.map(a => {
      const [icon, variant] = ICON_MAP[a.tipo] || ["check",""];
      return Components.timelineItem({ icon, variant, title: a.detalle, meta: `${Utils.dateTimeLabel(a.ts)} · ${a.meta}` });
    }).join("");
  }

  renderShell();
  document.addEventListener("blanc:sucursal-change", renderShell);
</script>
</body>
</html>
