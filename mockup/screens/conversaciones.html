<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<script>(function(){try{var t=localStorage.getItem("blanc-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Conversaciones · Blanc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ad2860%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22700%22>B</text></svg>" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#ad2860" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Blanc" />
<link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
<link rel="stylesheet" href="../css/tokens.css" />
<link rel="stylesheet" href="../css/base.css" />
<link rel="stylesheet" href="../css/components.css" />
<link rel="stylesheet" href="../css/screens.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <div class="main-area">
    <div id="topbar-mount"></div>
    <div class="page-content">
      <div class="page-header">
        <div>
          <div class="desc" id="scope-desc"></div>
          <div class="search-box mt-2" style="width:320px;"><span id="icon-search"></span><input class="input" id="buscar" placeholder="Buscar por clienta…" /></div>
        </div>
        <div class="filters-bar">
          <div class="filter-chip active" data-f="todas">Todas</div>
          <div class="filter-chip" data-f="bot"><span id="icon-bot"></span> Modo bot</div>
          <div class="filter-chip" data-f="humano"><span id="icon-humano"></span> Modo humano</div>
          <div class="filter-chip" data-f="cerrada">Cerradas</div>
        </div>
      </div>

      <div class="grid grid-4 mb-6" id="kpi-grid"></div>

      <div class="card animate-in">
        <div id="lista"></div>
        <div id="empty" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/app.js"></script>
<script src="../js/pwa.js"></script>
<script>
  App.init("conversaciones");
  document.getElementById("icon-search").innerHTML = ICONS.search;
  document.getElementById("icon-bot").innerHTML = ICONS.sparkle;
  document.getElementById("icon-humano").innerHTML = ICONS.user;
  let filtro = "todas", q = "";

  function lastMsg(conv) { return conv.mensajes[conv.mensajes.length - 1]; }

  function renderKpis() {
    const scoped = App.filterBySucursal(DB.conversaciones, c => c.sucursalId);
    document.getElementById("scope-desc").textContent = `Conversaciones de WhatsApp — ${App.scopeLabel()}`;
    document.getElementById("kpi-grid").innerHTML = [
      Components.statTile({ label: "Activas", value: scoped.filter(c=>c.estado==="activa").length }),
      Components.statTile({ label: "En modo bot", value: scoped.filter(c=>c.modo==="bot").length }),
      Components.statTile({ label: "Escaladas a humano", value: scoped.filter(c=>c.modo==="humano").length }),
      Components.statTile({ label: "Tiempo de respuesta", value: DB.kpis.tiempoRespuestaPromedio }),
    ].join("");
  }

  function render() {
    let list = App.filterBySucursal(DB.conversaciones, c => c.sucursalId).filter(c => {
      const cli = DB.cliente(c.clientaId);
      if (q && !cli.nombre.toLowerCase().includes(q.toLowerCase())) return false;
      if (filtro === "bot") return c.modo === "bot";
      if (filtro === "humano") return c.modo === "humano";
      if (filtro === "cerrada") return c.estado === "cerrada";
      return true;
    });
    list = list.sort((a,b) => lastMsg(b).ts - lastMsg(a).ts);

    document.getElementById("empty").style.display = list.length ? "none" : "block";
    if (!list.length) document.getElementById("empty").innerHTML = Components.emptyState({ icon: "chat", title: "Sin conversaciones", desc: "No hay conversaciones que coincidan con tu búsqueda o filtro." });

    document.getElementById("lista").innerHTML = list.map(c => {
      const cli = DB.cliente(c.clientaId);
      const msg = lastMsg(c);
      const preview = msg.tipo === "imagen" ? "📷 Imagen enviada" : msg.tipo === "audio" ? "🎤 Nota de voz" : msg.texto;
      return `<a href="chat.html?id=${c.id}" class="card-body flex items-center gap-4" style="border-bottom:1px solid var(--border);cursor:pointer;">
        ${Utils.avatarHTML(cli.nombre, "md")}
        <div style="min-width:0;flex:1;">
          <div class="flex items-center gap-2">
            <span class="font-semibold text-sm truncate">${cli.nombre}</span>
            ${c.modo === "humano" ? `<span class="badge badge-warning">${ICONS.user}Humano</span>` : `<span class="badge badge-accent">${ICONS.sparkle}Bot</span>`}
            ${c.estado === "cerrada" ? `<span class="badge badge-neutral">Cerrada</span>` : ""}
          </div>
          <div class="text-sm text-secondary truncate mt-1">${msg.de === "clienta" ? "" : "Tú: "}${preview}</div>
        </div>
        <div class="flex flex-col items-end gap-1" style="flex-shrink:0;">
          <span class="text-xs text-tertiary">${Utils.relativeTime(msg.ts)}</span>
          <span class="text-xs text-tertiary">${DB.sucursal(c.sucursalId).nombre.replace("Blanc ","")}</span>
        </div>
      </a>`;
    }).join("");
  }

  Utils.qsa(".filter-chip").forEach(chip => chip.addEventListener("click", () => {
    Utils.qsa(".filter-chip").forEach(c => c.classList.remove("active")); chip.classList.add("active");
    filtro = chip.dataset.f; render();
  }));
  document.getElementById("buscar").addEventListener("input", (e) => { q = e.target.value; render(); });

  renderKpis();
  render();
  document.addEventListener("blanc:sucursal-change", () => { renderKpis(); render(); });
</script>
</body>
</html>
